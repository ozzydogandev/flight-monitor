name: Flight Deal Monitor

on:
  workflow_dispatch:          # triggered by cron-job.org every hour

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit seen_deals.json back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight monitor
        run: python flight_monitor.py
        env:
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:         ${{ secrets.NOTIFY_EMAIL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit seen deals cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json || true
          git diff --staged --quiet || git commit -m "chore: update seen deals cache [skip ci]"
          git push || true
